<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vyzkaris Covenant — Archive</title>
<style>
  :root{
    --bg:#0a0a0d;
    --bg-panel:#111116;
    --border:#26262e;
    --gold:#c9a86a;
    --gold-dim:#8a7248;
    --text:#e4e2db;
    --text-dim:#8b8a8f;
    --red:#8a2f2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Georgia','Times New Roman',serif;
    line-height:1.6;
    min-height:100vh;
  }
  .backdrop{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at top, rgba(201,168,106,0.06), transparent 60%),
      linear-gradient(180deg, #0a0a0d 0%, #0d0d11 100%);
  }
  header{
    text-align:center;
    padding:5rem 1.5rem 3rem;
    border-bottom:1px solid var(--border);
  }
  .sigil{
    width:56px; height:56px;
    margin:0 auto 1.5rem;
    border:1.5px solid var(--gold-dim);
    transform:rotate(45deg);
    display:flex; align-items:center; justify-content:center;
  }
  .sigil::after{
    content:'V';
    transform:rotate(-45deg);
    font-family:'Georgia',serif;
    font-size:1.4rem;
    color:var(--gold);
    font-weight:bold;
  }
  h1{
    font-family:'Trajan Pro','Cinzel','Georgia',serif;
    letter-spacing:0.18em;
    font-size:1.9rem;
    margin:0 0 0.5rem;
    color:#f2ede0;
    text-transform:uppercase;
    font-weight:400;
  }
  .subtitle{
    color:var(--gold);
    letter-spacing:0.35em;
    font-size:0.78rem;
    text-transform:uppercase;
    margin:0;
  }
  .tagline{
    color:var(--text-dim);
    font-size:0.92rem;
    font-style:italic;
    margin-top:1.25rem;
    max-width:32rem;
    margin-left:auto; margin-right:auto;
  }
  main{
    max-width:44rem;
    margin:0 auto;
    padding:3.5rem 1.5rem 6rem;
  }
  .section-label{
    display:flex; align-items:center; gap:1rem;
    color:var(--gold);
    letter-spacing:0.28em;
    font-size:0.75rem;
    text-transform:uppercase;
    margin-bottom:2.5rem;
  }
  .section-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .timeline{
    position:relative;
    border-left:1px solid var(--border);
    padding-left:2rem;
  }
  .entry{
    position:relative;
    margin-bottom:2.75rem;
  }
  .entry::before{
    content:'';
    position:absolute;
    left:-2.42rem;
    top:0.35rem;
    width:9px; height:9px;
    background:var(--bg);
    border:1.5px solid var(--gold);
    transform:rotate(45deg);
  }
  .entry-date{
    font-family:'Courier New',monospace;
    font-size:0.78rem;
    color:var(--gold-dim);
    letter-spacing:0.06em;
  }
  .entry-cat{
    display:inline-block;
    font-family:'Courier New',monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    border:1px solid var(--border);
    padding:0.1rem 0.5rem;
    margin-left:0.6rem;
    border-radius:2px;
  }
  .entry h2{
    font-size:1.15rem;
    font-weight:400;
    color:#f2ede0;
    margin:0.5rem 0 0.5rem;
    letter-spacing:0.01em;
  }
  .entry p{
    color:var(--text-dim);
    font-size:0.94rem;
    margin:0;
  }
  .empty-state{
    color:var(--text-dim);
    font-style:italic;
    font-size:0.9rem;
    padding:1rem 0;
  }
  footer{
    text-align:center;
    padding:2.5rem 1.5rem 3.5rem;
    border-top:1px solid var(--border);
    color:var(--text-dim);
    font-size:0.75rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
  }
  footer span{color:var(--gold-dim);}
</style>
</head>
<body>
<div class="backdrop"></div>

<header>
  <div class="sigil"></div>
  <h1>The Vyzkaris Covenant</h1>
  <p class="subtitle">The Annals</p>
  <p class="tagline">A record of the Covenant's founding, its laws, its wars, and its people — kept as they happen, not rewritten after.</p>
</header>

<main>
  <div class="section-label">Chronological Record</div>
  <div class="timeline" id="timeline">
    <p class="empty-state">Loading records…</p>
  </div>
</main>

<footer>Order within chaos <span>·</span> Strength through unity</footer>

<script>
fetch('logs.json')
  .then(r => r.json())
  .then(entries => {
    const el = document.getElementById('timeline');
    if (!entries.length) {
      el.innerHTML = '<p class="empty-state">No records yet. The first entry has not been written.</p>';
      return;
    }
    entries.sort((a, b) => new Date(b.date) - new Date(a.date));
    el.innerHTML = entries.map(e => `
      <div class="entry">
        <span class="entry-date">${e.date}</span><span class="entry-cat">${e.category || 'General'}</span>
        <h2>${e.title}</h2>
        <p>${e.body}</p>
      </div>
    `).join('');
  })
  .catch(() => {
    document.getElementById('timeline').innerHTML = '<p class="empty-state">Records could not be loaded.</p>';
  });
</script>
</body>
</html>
